<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Review Hub</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="brand/favicon.ico" sizes="any">
  <link rel="icon" href="brand/hp-favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css?v=23">
</head>
<body>
  <header class="top">
    <div class="container top-inner">
      <a href="#" class="brand"><img src="brand/hp-icon.svg" alt="" width="28" height="28"> Review Hub</a>
    </div>
  </header>

  <main id="app" class="container main"></main>
  <footer class="foot">© <span id="year">2026</span> Phạm Quốc Hoàng · Review Hub · <a href="https://hoangpham.is-a.dev" target="_blank" rel="noopener">hoangpham.is-a.dev</a></footer>

  <dialog id="dlgPlay" class="player">
    <form method="dialog"><button class="ghost small close" aria-label="Đóng">✕</button></form>
    <video id="playVideo" controls playsinline></video>
    <img id="playImg" alt="">
    <div class="row between player-bar"><span id="playName" class="fname"></span><a id="playDl" class="btn small">Tải về</a></div>
  </dialog>

  <dialog id="dlgNew">
    <form method="dialog" id="formNew">
      <div class="dlg-head"><h2>Sản phẩm mới</h2><button type="button" value="cancel" class="ghost x" aria-label="Đóng">✕</button></div>
      <label>Tên sản phẩm
        <input name="name" required maxlength="120" placeholder="Dép sục phối màu ZUTANIQ">
      </label>
      <label>Ghi chú cho người dựng
        <textarea name="note" rows="4" placeholder="Màu, thương hiệu, điểm nổi bật, deal, link sản phẩm..."></textarea>
      </label>
      <div class="row end actions">
        <button type="submit" value="ok" class="primary">Tạo</button>
        <button type="button" value="cancel" formnovalidate>Huỷ</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgNote">
    <form method="dialog" id="formNote">
      <div class="dlg-head"><h2>Sửa ghi chú</h2><button type="button" value="cancel" class="ghost x" aria-label="Đóng">✕</button></div>
      <label>Ghi chú cho người dựng
        <textarea name="note" rows="5" placeholder="Màu, thương hiệu, điểm nổi bật, deal, link sản phẩm..."></textarea>
      </label>
      <div class="row end actions">
        <button type="submit" value="ok" class="primary">Lưu</button>
        <button type="button" value="cancel" formnovalidate>Huỷ</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgConfirm">
    <form method="dialog" id="formConfirm">
      <div class="dlg-head"><h2 id="confirmTitle">Xoá?</h2><button type="button" value="cancel" class="ghost x" aria-label="Đóng">✕</button></div>
      <p class="meta" id="confirmText" style="margin:0 0 8px"></p>
      <div class="row end actions">
        <button type="submit" value="ok" class="primary danger-fill">Xoá</button>
        <button type="button" value="cancel" formnovalidate>Huỷ</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script>document.getElementById("year").textContent = new Date().getFullYear()</script>
  <script src="app.js?v=23"></script>
</body>
</html>
